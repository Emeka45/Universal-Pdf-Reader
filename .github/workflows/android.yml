name: Build Universal PDF Reader

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare PDF filename and release build
        run: python3 scripts/prepare_build.py

      - name: Normalize Kotlin DSL JDK properties reference
        run: sed -i 's/java\.util\.Properties()/Properties()/g' app/build.gradle.kts

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-pdf-reader-debug
          path: app/build/outputs/apk/debug/*.apk

      # Pull requests may not receive repository secrets, especially when opened
      # from forks. Keep PR validation on the debug build only.
      - name: Require release signing configuration
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: Required release signing secret $name is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure all four release signing secrets before running a store release."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode >/tmp/universal-pdf-reader-release.jks
          if ! keytool -list -keystore /tmp/universal-pdf-reader-release.jks               -storepass "$RELEASE_STORE_PASSWORD"               -alias "$RELEASE_KEY_ALIAS" >/tmp/release-keytool.txt 2>&1; then
            echo "ERROR: The release keystore, store password, or key alias is invalid."
            exit 1
          fi
          rm -f /tmp/universal-pdf-reader-release.jks /tmp/release-keytool.txt

      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        run: gradle assembleRelease --no-daemon

      - name: Verify release APK signature
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found."
            exit 1
          fi
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: universal-pdf-reader-release
          path: app/build/outputs/apk/release/*.apk

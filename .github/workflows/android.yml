name: Build Universal PDF Reader

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare PDF filename and release build
        run: python3 scripts/prepare_build.py

      - name: Normalize Kotlin DSL JDK properties reference
        run: sed -i 's/java\.util\.Properties()/Properties()/g' app/build.gradle.kts

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-pdf-reader-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Require release signing configuration
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: Release signing key is not configured. Refusing to treat a debug APK as a store release."
            exit 1
          fi

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Verify release APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No release APK found."
            exit 1
          fi
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: universal-pdf-reader-release
          path: app/build/outputs/apk/release/*.apk
